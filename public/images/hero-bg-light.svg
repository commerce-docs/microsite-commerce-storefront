<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FCE7F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE9FE;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightGlow1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="lightGlow2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="lightGlow3" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="lightGlow4" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0" />
    </radialGradient>
    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lightStrongGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base light gradient -->
  <rect width="1920" height="1080" fill="url(#lightBg)"/>
  
  <!-- Vibrant glows -->
  <ellipse cx="400" cy="300" rx="600" ry="400" fill="url(#lightGlow1)"/>
  <ellipse cx="1500" cy="700" rx="700" ry="500" fill="url(#lightGlow2)"/>
  <ellipse cx="960" cy="540" rx="500" ry="400" fill="url(#lightGlow3)"/>
  <ellipse cx="300" cy="900" rx="500" ry="400" fill="url(#lightGlow4)"/>
  
  <!-- Cyberpunk grid lines -->
  <g stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.5">
    <line x1="0" y1="200" x2="1920" y2="200" filter="url(#lightGlow)">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="540" x2="1920" y2="540" filter="url(#lightGlow)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="880" x2="1920" y2="880" filter="url(#lightGlow)">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <g stroke="#EC4899" stroke-width="2" fill="none" opacity="0.5">
    <line x1="320" y1="0" x2="320" y2="1080" filter="url(#lightGlow)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.5s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="0" x2="960" y2="1080" filter="url(#lightGlow)">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1600" y1="0" x2="1600" y2="1080" filter="url(#lightGlow)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Vibrant hexagons -->
  <g stroke="#06B6D4" stroke-width="3" fill="none" opacity="0.7" filter="url(#lightStrongGlow)">
    <polygon points="300,400 350,370 400,400 400,460 350,490 300,460">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 350 430; 360 350 430" dur="20s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <g stroke="#EC4899" stroke-width="3" fill="none" opacity="0.7" filter="url(#lightStrongGlow)">
    <polygon points="1500,600 1550,570 1600,600 1600,660 1550,690 1500,660">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 1550 630; -360 1550 630" dur="25s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <g stroke="#8B5CF6" stroke-width="3" fill="none" opacity="0.7" filter="url(#lightStrongGlow)">
    <polygon points="1600,200 1650,170 1700,200 1700,260 1650,290 1600,260">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 1650 230; 360 1650 230" dur="22s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Glowing particles -->
  <g>
    <circle cx="500" cy="250" r="4" fill="#06B6D4" opacity="0.8" filter="url(#lightGlow)">
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;200;250" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="600" r="3" fill="#EC4899" opacity="0.8" filter="url(#lightGlow)">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="600;550;600" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="800" r="4" fill="#8B5CF6" opacity="0.8" filter="url(#lightGlow)">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="800;750;800" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1400" cy="400" r="3" fill="#06B6D4" opacity="0.8" filter="url(#lightGlow)">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="400;350;400" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Scan lines effect -->
  <g opacity="0.08">
    <rect x="0" y="0" width="1920" height="2" fill="#06B6D4">
      <animate attributeName="y" values="-10;1080" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="1920" height="2" fill="#EC4899">
      <animate attributeName="y" values="-10;1080" dur="10s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Vibrant squares -->
  <g opacity="0.35">
    <rect x="200" y="700" width="80" height="80" fill="none" stroke="#06B6D4" stroke-width="2" filter="url(#lightGlow)">
      <animate attributeName="y" values="700;680;700" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1650" y="850" width="60" height="60" fill="none" stroke="#EC4899" stroke-width="2" filter="url(#lightGlow)">
      <animate attributeName="y" values="850;870;850" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Additional accent circles -->
  <g opacity="0.3">
    <circle cx="150" cy="150" r="30" fill="none" stroke="#8B5CF6" stroke-width="2" filter="url(#lightGlow)">
      <animate attributeName="r" values="25;35;25" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1800" cy="950" r="25" fill="none" stroke="#06B6D4" stroke-width="2" filter="url(#lightGlow)">
      <animate attributeName="r" values="20;30;20" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
