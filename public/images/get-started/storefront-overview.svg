  <rect x="20" y="204" width="820" height="164" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" filter="url(#s)"/>
  <text x="430" y="221" text-anchor="middle" font-size="8" font-weight="700" fill="#92400E" letter-spacing="1.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">YOUR STOREFRONT CODE</text>

