<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 648">
  <defs>
    <filter id="s" x="-3%" y="-6%" width="106%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.07"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#9CA3AF"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#22C55E"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="860" height="648" fill="#F8FAFC" rx="14"/>

  <!-- TITLE -->
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Adobe Commerce Storefront &#x2014; How It Fits Together</text>

  <!-- SHOPPERS -->
  <rect x="20" y="40" width="820" height="52" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="40" y="51" width="30" height="22" rx="2" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="55" y1="73" x2="55" y2="80" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="47" y1="80" x2="63" y2="80" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="84" cy="62" r="8" fill="none" stroke="#60A5FA" stroke-width="1.2"/>
  <ellipse cx="84" cy="62" rx="4" ry="8" fill="none" stroke="#60A5FA" stroke-width="0.8"/>
  <line x1="76" y1="62" x2="92" y2="62" stroke="#60A5FA" stroke-width="0.8"/>
  <text x="102" y="60" font-size="12" font-weight="700" fill="#1D4ED8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Shoppers</text>
  <text x="102" y="78" font-size="9.5" fill="#3B82F6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Browser &#xB7; Pages served from CDN edge nodes worldwide &#xB7; No server-side round-trips on the critical path &#xB7; Lighthouse 100 achievable</text>

  <!-- Arrow Shoppers to EDS -->
  <line x1="430" y1="92" x2="430" y2="112" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <polygon points="427,92 433,92 430,85" fill="#CBD5E1"/>
  <text x="443" y="106" font-size="9" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">HTTP &#xB7; CDN</text>

  <!-- EDGE DELIVERY SERVICES -->
  <rect x="20" y="116" width="820" height="64" rx="8" fill="#1E3A8A" filter="url(#s)"/>
  <rect x="698" y="129" width="128" height="38" rx="6" fill="rgba(255,255,255,0.11)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="762" y="146" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.9)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">GitHub Repo</text>
  <text x="762" y="160" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.55)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">your storefront code</text>
  <text x="355" y="138" text-anchor="middle" font-size="8" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">BUILDING BLOCK 5 &#xB7; DELIVERY LAYER</text>
  <text x="355" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Edge Delivery Services</text>
  <text x="355" y="174" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.68)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Pulls from GitHub &#xB7; Serves HTML/CSS/JS from global edge &#xB7; Transforms docs to blocks &#xB7; No servers to manage</text>

  <!-- Arrow EDS to Storefront -->
  <line x1="430" y1="180" x2="430" y2="200" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <polygon points="427,180 433,180 430,173" fill="#CBD5E1"/>
  <text x="443" y="194" font-size="9" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">JS &#xB7; CSS &#xB7; Blocks</text>

