  <text x="326" y="245" text-anchor="middle" font-size="7.5" font-weight="700" fill="#7C2D12" letter-spacing="1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">BUILDING BLOCK 3</text>
  <text x="326" y="261" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Storefront SDK</text>
  <text x="326" y="276" text-anchor="middle" font-size="9" fill="#7C2D12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">@dropins/storefront-sdk</text>
  <line x1="254" y1="284" x2="405" y2="284" stroke="#FB923C" stroke-width="0.6" stroke-dasharray="3,3"/>
  <text x="256" y="298" font-size="9" fill="#7C2D12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">API initializer</text>
  <text x="256" y="313" font-size="9" fill="#7C2D12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">UI components</text>
  <text x="256" y="328" font-size="9" fill="#7C2D12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Design tokens</text>
  <text x="256" y="343" font-size="9" fill="#7C2D12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Shared utilities</text>

  <!-- Sub: Drop-ins -->
  <rect x="426" y="228" width="402" height="130" rx="6" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="627" y="245" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1E40AF" letter-spacing="1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">BUILDING BLOCK 1 &#x2014; MOST IMPORTANT</text>
  <text x="627" y="261" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1D4ED8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Drop-ins</text>
  <text x="627" y="276" text-anchor="middle" font-size="9" fill="#1E40AF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Self-contained npm packages &#xB7; slots &#xB7; events &#xB7; transformers</text>
  <line x1="440" y1="284" x2="820" y2="284" stroke="#60A5FA" stroke-width="0.6" stroke-dasharray="3,3"/>

