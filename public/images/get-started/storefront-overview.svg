  <rect x="32" y="228" width="195" height="130" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="129" y="245" text-anchor="middle" font-size="7.5" font-weight="700" fill="#78350F" letter-spacing="1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">BUILDING BLOCK 2</text>
  <text x="129" y="261" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Boilerplate</text>
  <text x="129" y="276" text-anchor="middle" font-size="9" fill="#78350F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">GitHub template &#x2192; your project</text>
  <line x1="46" y1="284" x2="219" y2="284" stroke="#F59E0B" stroke-width="0.6" stroke-dasharray="3,3"/>
  <text x="48" y="298" font-size="9" fill="#78350F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">scripts/commerce.js</text>
  <text x="48" y="313" font-size="9" fill="#78350F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">styles/ &#xB7; blocks/</text>
  <text x="48" y="328" font-size="9" fill="#78350F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">config.js</text>
  <text x="48" y="343" font-size="9" fill="#78350F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Drop-in registrations</text>

