  <rect x="558" y="290" width="40" height="18" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="578" y="303" text-anchor="middle" font-size="8.5" fill="#1E40AF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">PDP</text>
  <rect x="602" y="290" width="38" height="18" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="621" y="303" text-anchor="middle" font-size="8.5" fill="#1E40AF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">PLP</text>
  <rect x="644" y="290" width="38" height="18" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="663" y="303" text-anchor="middle" font-size="8.5" fill="#1E40AF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Auth</text>
  <rect x="686" y="290" width="82" height="18" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="727" y="303" text-anchor="middle" font-size="8.5" fill="#1E40AF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">User Account</text>
  <rect x="772" y="290" width="50" height="18" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="797" y="303" text-anchor="middle" font-size="8.5" fill="#1E40AF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Orders</text>

  <!-- B2B label + pills -->
  <text x="440" y="327" font-size="8" font-weight="700" fill="#4338CA" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">B2B</text>
  <rect x="462" y="314" width="102" height="18" rx="9" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="513" y="327" text-anchor="middle" font-size="8.5" fill="#3730A3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Purchase Orders</text>
  <rect x="572" y="314" width="114" height="18" rx="9" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="629" y="327" text-anchor="middle" font-size="8.5" fill="#3730A3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Requisition Lists</text>
  <rect x="694" y="314" width="128" height="18" rx="9" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="758" y="327" text-anchor="middle" font-size="8.5" fill="#3730A3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Negotiable Quotes</text>

  <!-- Extension note -->
  <text x="440" y="352" font-size="8.5" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Extension points: slots &#xB7; events &#xB7; transformers &#xB7; CSS custom properties &#xB7; configuration API</text>

  <!-- Short connector: storefront to BB4 band -->
  <line x1="430" y1="368" x2="430" y2="382" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- BUILDING BLOCK 4: Commerce APIs band -->
  <rect x="20" y="382" width="820" height="52" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#s)"/>
  <!-- Bidirectional arrows (request down, response up) on left side of band -->
  <line x1="36" y1="394" x2="36" y2="422" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <polygon points="33,394 39,394 36,387" fill="#22C55E"/>
  <line x1="48" y1="422" x2="48" y2="394" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <polygon points="45,422 51,422 48,429" fill="#22C55E"/>
  <text x="430" y="399" text-anchor="middle" font-size="7.5" font-weight="700" fill="#14532D" letter-spacing="1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">BUILDING BLOCK 4 &#xB7; API LAYER</text>
  <text x="430" y="415" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803D" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Commerce APIs</text>
  <text x="430" y="429" text-anchor="middle" font-size="9" fill="#166534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">GraphQL (primary) &#xB7; REST (supplemental) &#xB7; Configured in config.js &#xB7; Wired automatically by each drop-in</text>

  <!-- Short connector: BB4 band to backends -->
  <line x1="430" y1="434" x2="430" y2="448" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Arrow Storefront to AEP (originates from storefront JS, threads through sub-box gap at x=278) -->
  <line x1="278" y1="368" x2="278" y2="558" stroke="#A78BFA" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-p)"/>
  <polygon points="275,368 281,368 278,361" fill="#A78BFA"/>
  <text x="284" y="378" font-size="8" fill="#7C3AED" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Storefront &#x2192; AEP</text>
  <text x="284" y="547" font-size="8" fill="#7C3AED" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Behavioral &amp; transactional events</text>
  <text x="284" y="557" font-size="8" fill="#7C3AED" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">via Data Connection extension</text>

  <!-- BACKENDS -->
  <rect x="20" y="448" width="820" height="96" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2" filter="url(#s)"/>
  <text x="430" y="464" text-anchor="middle" font-size="8" font-weight="700" fill="#7F1D1D" letter-spacing="1.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">COMMERCE BACKENDS</text>

  <!-- Adobe Commerce -->
  <rect x="32" y="472" width="240" height="60" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="152" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Adobe Commerce</text>
  <text x="152" y="505" text-anchor="middle" font-size="9" fill="#991B1B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Self-managed &#xB7; Cloud or on-premises &#xB7; v2.4.7+</text>
  <text x="152" y="519" text-anchor="middle" font-size="8.5" fill="#B91C1C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Catalog &#xB7; Cart &#xB7; Orders &#xB7; B2B &#xB7; Promotions</text>

  <!-- ACCS -->
  <rect x="284" y="472" width="238" height="60" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="403" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Commerce as a Cloud Service</text>
  <text x="403" y="505" text-anchor="middle" font-size="9" fill="#991B1B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">ACCS &#xB7; Fully managed SaaS &#xB7; Recommended</text>
  <text x="403" y="519" text-anchor="middle" font-size="8.5" fill="#B91C1C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Adobe-managed &#xB7; Auto upgrades &#xB7; Latest capabilities</text>

  <!-- ACO -->
  <rect x="534" y="472" width="294" height="60" rx="6" fill="#FDF4FF" stroke="#E879F9" stroke-width="1"/>
  <text x="681" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#701A75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Commerce Optimizer (ACO)</text>
  <text x="681" y="505" text-anchor="middle" font-size="9" fill="#701A75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Ultra-fast catalog APIs &#xB7; High-traffic search &amp; discovery</text>
  <text x="681" y="519" text-anchor="middle" font-size="8.5" fill="#86198F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Sits between backend &amp; storefront &#xB7; No Commerce config changes</text>

  <!-- AEP -->
  <rect x="20" y="562" width="820" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" filter="url(#s)"/>
  <text x="430" y="578" text-anchor="middle" font-size="8" font-weight="700" fill="#4C1D95" letter-spacing="1.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">DATA PLATFORM &#xB7; OPTIONAL BUT RECOMMENDED FOR PRODUCTION</text>
  <text x="430" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Adobe Experience Platform (AEP) + Data Connection</text>
  <text x="430" y="612" text-anchor="middle" font-size="9" fill="#6D28D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Receives: storefront behavioral &amp; transactional events via the Data Connection extension</text>
  <text x="430" y="627" text-anchor="middle" font-size="9" fill="#6D28D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Returns: Personalization &#xB7; Product Recommendations &#xB7; Live Search results &#xB7; Analytics</text>

</svg>
