<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A1F3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1729;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="neon1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="neon2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FF00E5;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FF00E5;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="neon3" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#7B2FFF;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#7B2FFF;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base dark gradient -->
  <rect width="1920" height="1080" fill="url(#darkBg)"/>
  
  <!-- Neon glows -->
  <ellipse cx="400" cy="300" rx="600" ry="400" fill="url(#neon1)"/>
  <ellipse cx="1500" cy="700" rx="700" ry="500" fill="url(#neon2)"/>
  <ellipse cx="960" cy="540" rx="500" ry="400" fill="url(#neon3)"/>
  
  <!-- Cyberpunk grid lines -->
  <g stroke="#00D9FF" stroke-width="2" fill="none" opacity="0.6">
    <line x1="0" y1="200" x2="1920" y2="200" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="540" x2="1920" y2="540" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="880" x2="1920" y2="880" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <g stroke="#FF00E5" stroke-width="2" fill="none" opacity="0.6">
    <line x1="320" y1="0" x2="320" y2="1080" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.5s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="0" x2="960" y2="1080" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1600" y1="0" x2="1600" y2="1080" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Neon hexagons -->
  <g stroke="#00D9FF" stroke-width="3" fill="none" opacity="0.8" filter="url(#strongGlow)">
    <polygon points="300,400 350,370 400,400 400,460 350,490 300,460">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 350 430; 360 350 430" dur="20s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <g stroke="#FF00E5" stroke-width="3" fill="none" opacity="0.8" filter="url(#strongGlow)">
    <polygon points="1500,600 1550,570 1600,600 1600,660 1550,690 1500,660">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 1550 630; -360 1550 630" dur="25s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <g stroke="#7B2FFF" stroke-width="3" fill="none" opacity="0.8" filter="url(#strongGlow)">
    <polygon points="1600,200 1650,170 1700,200 1700,260 1650,290 1600,260">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 1650 230; 360 1650 230" dur="22s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Glowing particles -->
  <g>
    <circle cx="500" cy="250" r="4" fill="#00D9FF" opacity="0.9" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;200;250" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="600" r="3" fill="#FF00E5" opacity="0.9" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="600;550;600" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="800" r="4" fill="#7B2FFF" opacity="0.9" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="800;750;800" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1400" cy="400" r="3" fill="#00D9FF" opacity="0.9" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="400;350;400" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Scan lines effect -->
  <g opacity="0.1">
    <rect x="0" y="0" width="1920" height="2" fill="#00D9FF">
      <animate attributeName="y" values="-10;1080" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="1920" height="2" fill="#FF00E5">
      <animate attributeName="y" values="-10;1080" dur="10s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Neon squares -->
  <g opacity="0.4">
    <rect x="200" y="700" width="80" height="80" fill="none" stroke="#00D9FF" stroke-width="2" filter="url(#glow)">
      <animate attributeName="y" values="700;680;700" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1650" y="850" width="60" height="60" fill="none" stroke="#FF00E5" stroke-width="2" filter="url(#glow)">
      <animate attributeName="y" values="850;870;850" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
