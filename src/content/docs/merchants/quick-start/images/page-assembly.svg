<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="768" viewBox="0 0 1333 768" role="img" aria-labelledby="title description">
  <title id="title">How authors assemble storefront pages</title>
  <desc id="description">Authors assemble storefront pages with content blocks for text and media and Commerce blocks for shopping features. Authors choose each block's content, settings, and available layouts. Page designers and developers build and maintain block options. New layouts and changes to block behavior require development work.</desc>
  <defs>
    <style>
      @font-face {
        font-family: adobe-clean;
        src: url('../../../../../fonts/adobe-clean-400.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: adobe-clean;
        src: url('../../../../../fonts/adobe-clean-700.woff2') format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: adobe-clean;
        src: url('../../../../../fonts/adobe-clean-900.woff2') format('woff2');
        font-weight: 900;
      }
      text {
        font-family: adobe-clean, 'Helvetica Neue', Arial, sans-serif;
        text-anchor: middle;
      }
      .role { font-size: 28px; font-weight: 700; }
      .action { font-size: 24px; fill: #c00; }
      .icon {
        fill: none;
        stroke: #c00;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .connector {
        fill: none;
        stroke: #c00;
        stroke-width: 2.4;
        stroke-dasharray: 3 4;
        marker-end: url(#arrow);
      }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m2 1 8 5-8 5" fill="none" stroke="#c00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1333" height="768" fill="#fff"/>

  <g class="icon" transform="translate(641 39) scale(1.4)">
    <path d="m2 24 3-10L19 0a3.5 3.5 0 0 1 5 5L10 19Zm14-21 5 5M2 24l8-5M13 23h12"/>
  </g>
  <text class="role" x="657" y="110">Authors</text>
  <text x="657" y="141" font-size="24">Assemble and configure pages</text>

  <g class="icon" transform="translate(157 158) scale(1.4)">
    <rect x="2" y="2" width="22" height="8" rx="1"/>
    <rect x="2" y="15" width="10" height="9" rx="1"/>
    <rect x="17" y="15" width="7" height="9" rx="1"/>
  </g>
  <text class="role" x="175" y="228">Content blocks</text>

  <g class="icon" transform="translate(1122 158) scale(1.4)">
    <path d="M0 2h3l4 17h15l3-13H4M7 19l-1 3h16"/>
    <circle cx="8" cy="26" r="2"/>
    <circle cx="21" cy="26" r="2"/>
  </g>
  <text class="role" x="1140" y="228">Commerce blocks</text>

  <path class="connector" d="M657 160V351"/>
  <path class="connector" d="M265 240 420 374"/>
  <path class="connector" d="M1065 240 899 374"/>

  <rect x="520" y="215" width="274" height="65" fill="#fff"/>
  <text class="action" x="657" y="239">choose content, settings,</text>
  <text class="action" x="657" y="269">and available layouts</text>

  <rect x="253" y="278" width="168" height="65" fill="#fff"/>
  <text class="action" x="337" y="302">add text</text>
  <text class="action" x="337" y="332">and media</text>

  <rect x="904" y="278" width="192" height="65" fill="#fff"/>
  <text class="action" x="1000" y="302">add shopping</text>
  <text class="action" x="1000" y="332">features</text>

  <text x="657" y="413" font-size="38" font-weight="900">Your storefront page</text>
  <text x="657" y="452" font-size="30" fill="#767676">Content and shopping features</text>

  <path class="connector" d="M657 641V478"/>
  <rect x="497" y="538" width="320" height="75" fill="#fff"/>
  <text class="action" x="657" y="565">develop new layouts</text>
  <text class="action" x="657" y="595">and behavior changes</text>

  <g class="icon" transform="translate(640 654) scale(1.4)">
    <path d="M8 2H5a2 2 0 0 0-2 2v6c0 2-1 3-3 3 2 0 3 1 3 3v6a2 2 0 0 0 2 2h3M18 2h3a2 2 0 0 1 2 2v6c0 2 1 3 3 3-2 0-3 1-3 3v6a2 2 0 0 1-2 2h-3"/>
  </g>
  <text class="role" x="657" y="725">Page designers and developers</text>
  <text x="657" y="755" font-size="24">Build and maintain block options</text>
</svg>
