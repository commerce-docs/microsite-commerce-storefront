<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="'Adobe Clean', 'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,1.5 L10,6 L2,10.5" fill="none" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1100" height="800" fill="#FFFFFF"/>

  <!-- Storefront page (browser frame) -->
  <rect x="170" y="20" width="760" height="576" rx="22" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(534 42)" fill="none" stroke="#BB0000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="32" height="32" rx="4"/>
    <path d="M0,11 H32 M12,11 V32"/>
  </g>
  <text x="550" y="112" font-size="32" font-weight="800" fill="#080808">Storefront page</text>
  <text x="550" y="142" font-size="22" fill="#626161">Text, images, and blocks</text>

  <!-- Content blocks -->
  <rect x="210" y="172" width="680" height="252" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <g transform="translate(455 196)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linejoin="round">
    <rect x="0" y="0" width="34" height="12" rx="2.5"/>
    <rect x="0" y="17" width="15" height="13" rx="2.5"/>
    <rect x="19" y="17" width="15" height="13" rx="2.5"/>
  </g>
  <text x="501" y="220" font-size="23" font-weight="700" fill="#080808" text-anchor="start">Content blocks</text>
  <text x="550" y="256" font-size="19" fill="#080808">accordions, cards, columns</text>

  <!-- Your content, nested inside Content blocks -->
  <rect x="250" y="276" width="600" height="124" rx="12" fill="#FFF7F7" stroke="#E49999" stroke-width="2"/>
  <text x="550" y="316" font-size="23" font-weight="700" fill="#080808">Your content</text>
  <g fill="none" stroke="#BB0000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Text -->
    <g transform="translate(384 350)">
      <path d="M2,17 L7.5,3 L13,17 M4.3,11.5 H10.7 M16,5 H23 M16,10.5 H23 M2,22 H23"/>
    </g>
    <!-- Images -->
    <g transform="translate(497 350)">
      <rect x="6" y="1" width="17" height="16" rx="2"/>
      <path d="M6,14 L11,9.5 L14.5,12.5 L17.5,10 L23,15"/>
      <circle cx="18.5" cy="5.5" r="1.6"/>
      <path d="M2,5 V20 A2,2 0 0 0 4,22 H18"/>
    </g>
    <!-- Videos -->
    <g transform="translate(633 350)">
      <rect x="1" y="2" width="22" height="20" rx="2"/>
      <path d="M6.5,2 V22 M17.5,2 V22 M1,8.5 H6.5 M1,15.5 H6.5 M17.5,8.5 H23 M17.5,15.5 H23"/>
    </g>
  </g>
  <text x="416" y="369" font-size="19" fill="#080808" text-anchor="start">Text</text>
  <text x="529" y="369" font-size="19" fill="#080808" text-anchor="start">Images</text>
  <text x="665" y="369" font-size="19" fill="#080808" text-anchor="start">Videos</text>

  <!-- Commerce blocks -->
  <rect x="210" y="444" width="680" height="112" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <g transform="translate(442 466)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1,2 H6 L10,19 H27 L31,7 H8"/>
    <circle cx="12" cy="25" r="2.6"/>
    <circle cx="25" cy="25" r="2.6"/>
  </g>
  <text x="486" y="489" font-size="23" font-weight="700" fill="#080808" text-anchor="start">Commerce blocks</text>
  <text x="550" y="527" font-size="19" fill="#080808">product lists, cart, checkout</text>

  <!-- Arrow into the page -->
  <path d="M550,676 L550,568" fill="none" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" marker-end="url(#arrow)"/>
  <text x="564" y="628" font-size="19" fill="#BB0000" text-anchor="start">supplies</text>

  <!-- Commerce data -->
  <g transform="translate(534 686)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="7" rx="10" ry="4.5"/>
    <path d="M2,7 V25 A10,4.5 0 0 0 22,25 V7 M2,13 A10,4.5 0 0 0 22,13 M2,19 A10,4.5 0 0 0 22,19"/>
    <path d="M30,14 L25.5,21 H30.5 L26,28"/>
  </g>
  <text x="550" y="756" font-size="23" font-weight="700" fill="#080808">Commerce data</text>
  <text x="550" y="784" font-size="19" fill="#080808">product names, prices, images, videos</text>
</svg>
