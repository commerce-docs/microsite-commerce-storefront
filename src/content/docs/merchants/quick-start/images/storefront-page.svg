<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="768" viewBox="0 0 1333 768" role="img" aria-labelledby="title description">
  <title id="title">How a storefront page comes together</title>
  <desc id="description">A storefront page combines content and Commerce blocks into a complete shopping experience. Authors configure content and layout. Page designers and developers ensure that design and functionality meet storefront standards. Shoppers browse, search, and buy.</desc>
  <defs>
    <style>
      @font-face {
        font-family: adobe-clean;
        src: url('../../../../../fonts/adobe-clean-400.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: adobe-clean;
        src: url('../../../../../fonts/adobe-clean-700.woff2') format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: adobe-clean;
        src: url('../../../../../fonts/adobe-clean-900.woff2') format('woff2');
        font-weight: 900;
      }
      text {
        font-family: adobe-clean, 'Helvetica Neue', Arial, sans-serif;
        text-anchor: middle;
      }
      .role { font-size: 28px; font-weight: 700; }
      .action { font-size: 24px; fill: #c00; }
      .icon {
        fill: none;
        stroke: #c00;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .connector {
        fill: none;
        stroke: #c00;
        stroke-width: 2.4;
        stroke-dasharray: 3 4;
        marker-end: url(#arrow);
      }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m2 1 8 5-8 5" fill="none" stroke="#c00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1333" height="768" fill="#fff"/>

  <g class="icon" transform="translate(641 39) scale(1.4)">
    <rect x="2" y="2" width="22" height="22" rx="2"/>
    <path d="M2 9h22M10 9v15"/>
  </g>
  <text class="role" x="657" y="110">Content and Commerce blocks</text>
  <text x="657" y="141" font-size="24">Content and shopping features</text>

  <g class="icon" transform="translate(157 158) scale(1.4)">
    <path d="m2 24 3-10L19 0a3.5 3.5 0 0 1 5 5L10 19Zm14-21 5 5M2 24l8-5M13 23h12"/>
  </g>
  <text class="role" x="175" y="228">Authors</text>

  <g class="icon" transform="translate(1122 158) scale(1.4)">
    <path d="M8 2H5a2 2 0 0 0-2 2v6c0 2-1 3-3 3 2 0 3 1 3 3v6a2 2 0 0 0 2 2h3M18 2h3a2 2 0 0 1 2 2v6c0 2 1 3 3 3-2 0-3 1-3 3v6a2 2 0 0 1-2 2h-3"/>
  </g>
  <text class="role" x="1140" y="213">Page designers</text>
  <text class="role" x="1140" y="245">and developers</text>

  <path class="connector" d="M657 160V351"/>
  <path class="connector" d="M265 240 420 374"/>
  <path class="connector" d="M1065 265 899 374"/>

  <rect x="533" y="215" width="248" height="65" fill="#fff"/>
  <text class="action" x="657" y="239">combine content</text>
  <text class="action" x="657" y="269">and shopping features</text>

  <rect x="235" y="278" width="205" height="65" fill="#fff"/>
  <text class="action" x="337" y="302">configure content</text>
  <text class="action" x="337" y="332">and layout</text>

  <rect x="858" y="279" width="284" height="65" fill="#fff"/>
  <text class="action" x="1000" y="303">meet design and</text>
  <text class="action" x="1000" y="333">functionality standards</text>

  <text x="657" y="413" font-size="38" font-weight="900">Your storefront page</text>
  <text x="657" y="452" font-size="30" fill="#767676">Complete shopping experience</text>

  <path class="connector" d="M657 641V478"/>
  <rect x="550" y="550" width="214" height="41" fill="#fff"/>
  <text class="action" x="657" y="577">browse, search, buy</text>

  <g class="icon" transform="translate(640 654) scale(1.4)">
    <path d="m2 6 4-5h14l4 5"/>
    <rect x="2" y="6" width="22" height="19" rx="2"/>
    <path d="M8 11a5 5 0 0 0 10 0"/>
  </g>
  <text class="role" x="657" y="725">Shoppers</text>
