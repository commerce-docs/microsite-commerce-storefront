<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" font-family="'Adobe Clean', 'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,1.5 L10,6 L2,10.5" fill="none" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1100" height="450" fill="#FFFFFF"/>

  <!-- Content view -->
  <rect x="40" y="30" width="450" height="390" rx="22" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="265" y="84" font-size="30" font-weight="800" fill="#080808">Content view</text>
  <text x="265" y="114" font-size="21" fill="#626161">The underlying document</text>

  <!-- Block table -->
  <rect x="65" y="160" width="400" height="168" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <rect x="65" y="160" width="400" height="56" fill="#EEEEEE" stroke="#BDBDBD" stroke-width="2"/>
  <path d="M65,272 H465 M265,216 V328" fill="none" stroke="#BDBDBD" stroke-width="2"/>
  <text x="265" y="195" font-size="23" font-weight="700" fill="#080808">commerce-cart</text>
  <text x="81" y="251" font-size="21" fill="#080808" text-anchor="start">Hide Heading</text>
  <text x="281" y="251" font-size="21" fill="#080808" text-anchor="start">false</text>
  <text x="81" y="307" font-size="21" fill="#080808" text-anchor="start">Checkout URL</text>
  <text x="281" y="307" font-size="21" fill="#080808" text-anchor="start">/checkout</text>

  <text x="265" y="366" font-size="19" fill="#080808">First row: the block name.</text>
  <text x="265" y="394" font-size="19" fill="#080808">Rows below: its settings.</text>

  <!-- Arrow -->
  <path d="M498,225 L602,225" fill="none" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" marker-end="url(#arrow)"/>
  <text x="550" y="205" font-size="19" fill="#BB0000">renders as</text>

  <!-- Layout view -->
  <rect x="610" y="30" width="450" height="390" rx="22" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="835" y="84" font-size="30" font-weight="800" fill="#080808">Layout view</text>
  <text x="835" y="114" font-size="21" fill="#626161">The page as shoppers see it</text>

  <!-- Rendered cart wireframe -->
  <rect x="640" y="150" width="390" height="170" rx="10" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <rect x="660" y="168" width="150" height="16" rx="8" fill="#BDBDBD"/>
  <rect x="660" y="200" width="56" height="56" rx="8" fill="#DEDEDE"/>
  <rect x="732" y="208" width="170" height="12" rx="6" fill="#BDBDBD"/>
  <rect x="732" y="232" width="110" height="10" rx="5" fill="#DEDEDE"/>
  <rect x="850" y="272" width="160" height="32" rx="16" fill="#BB0000"/>

  <text x="835" y="366" font-size="19" fill="#080808">Heading shows: Hide Heading is false.</text>
  <text x="835" y="394" font-size="19" fill="#080808">Checkout button goes to /checkout.</text>
</svg>
