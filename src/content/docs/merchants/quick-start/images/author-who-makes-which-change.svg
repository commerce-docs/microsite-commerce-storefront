<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" font-family="'Adobe Clean', 'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1100" height="480" fill="#FFFFFF"/>

  <!-- Author (you) -->
  <rect x="30" y="30" width="330" height="420" rx="22" fill="#FDECEC" stroke="#E49999" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(179 52)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4,28 L6,20 L21,5 L27,11 L12,26 Z M17,9 L23,15"/>
  </g>
  <text x="195" y="124" font-size="27" font-weight="800" fill="#080808">Author (you)</text>
  <text x="195" y="152" font-size="19" fill="#626161">In Experience Workspace</text>
  <path d="M54,176 H336" stroke="#E49999" stroke-width="2"/>
  <g fill="#BB0000">
    <circle cx="66" cy="210" r="4"/><circle cx="66" cy="256" r="4"/><circle cx="66" cy="302" r="4"/><circle cx="66" cy="348" r="4"/><circle cx="66" cy="394" r="4"/>
  </g>
  <g font-size="20" fill="#080808" text-anchor="start">
    <text x="82" y="216">Text and images</text>
    <text x="82" y="262">Which blocks appear</text>
    <text x="82" y="308">Block settings</text>
    <text x="82" y="354">Metadata and spacing</text>
    <text x="82" y="400">Labels and scheduling</text>
  </g>

  <!-- Page designer -->
  <rect x="385" y="30" width="330" height="420" rx="22" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(534 52)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="28" height="26" rx="3"/>
    <path d="M2,12 H30 M12,12 V29"/>
  </g>
  <text x="550" y="124" font-size="27" font-weight="800" fill="#080808">Page designer</text>
  <text x="550" y="152" font-size="19" fill="#626161">In the storefront code</text>
  <path d="M409,176 H691" stroke="#BDBDBD" stroke-width="2"/>
  <g fill="#BB0000">
    <circle cx="421" cy="210" r="4"/><circle cx="421" cy="256" r="4"/><circle cx="421" cy="302" r="4"/><circle cx="421" cy="348" r="4"/><circle cx="421" cy="394" r="4"/>
  </g>
  <g font-size="20" fill="#080808" text-anchor="start">
    <text x="437" y="216">New blocks</text>
    <text x="437" y="262">New layout options</text>
    <text x="437" y="308">Block styling</text>
    <text x="437" y="354">Behavior across devices</text>
    <text x="437" y="400">Connecting a drop-in</text>
  </g>

  <!-- Developer -->
  <rect x="740" y="30" width="330" height="420" rx="22" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(889 52)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11,8 L3,16 L11,24 M21,8 L29,16 L21,24 M18,5 L14,27"/>
  </g>
  <text x="905" y="124" font-size="27" font-weight="800" fill="#080808">Developer</text>
  <text x="905" y="152" font-size="19" fill="#626161">In drop-ins and Commerce</text>
  <path d="M764,176 H1046" stroke="#BDBDBD" stroke-width="2"/>
  <g fill="#BB0000">
    <circle cx="776" cy="210" r="4"/><circle cx="776" cy="256" r="4"/><circle cx="776" cy="302" r="4"/><circle cx="776" cy="348" r="4"/><circle cx="776" cy="394" r="4"/>
  </g>
  <g font-size="20" fill="#080808" text-anchor="start">
    <text x="792" y="216">New or added drop-ins</text>
    <text x="792" y="262">Changed shopping behavior</text>
    <text x="792" y="308">Drop-in colors and fonts</text>
    <text x="792" y="354">Analytics tracking</text>
    <text x="792" y="400">Commerce connection</text>
  </g>
</svg>
