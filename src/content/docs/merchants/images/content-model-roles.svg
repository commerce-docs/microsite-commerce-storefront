<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="'Adobe Clean', 'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,1.5 L10,6 L2,10.5" fill="none" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1100" height="800" fill="#FFFFFF"/>

  <!-- Role cards -->
  <rect x="30" y="30" width="330" height="180" rx="22" fill="#FDECEC" stroke="#E49999" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(179 50)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4,28 L6,20 L21,5 L27,11 L12,26 Z M17,9 L23,15"/>
  </g>
  <text x="195" y="120" font-size="26" font-weight="800" fill="#080808">Content author</text>
  <text x="195" y="150" font-size="19" fill="#080808">Document Authoring,</text>
  <text x="195" y="176" font-size="19" fill="#080808">Experience Workspace</text>

  <rect x="385" y="30" width="330" height="180" rx="22" fill="#FDECEC" stroke="#E49999" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(534 50)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="28" height="26" rx="3"/>
    <path d="M2,12 H30 M12,12 V29"/>
  </g>
  <text x="550" y="120" font-size="26" font-weight="800" fill="#080808">Page designer</text>
  <text x="550" y="150" font-size="19" fill="#080808">HTML, CSS, JavaScript, Git,</text>
  <text x="550" y="176" font-size="19" fill="#080808">blocks, Edge Delivery Services</text>

  <rect x="740" y="30" width="330" height="180" rx="22" fill="#FDECEC" stroke="#E49999" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(889 50)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11,8 L3,16 L11,24 M21,8 L29,16 L21,24 M18,5 L14,27"/>
  </g>
  <text x="905" y="120" font-size="26" font-weight="800" fill="#080808">Developer</text>
  <text x="905" y="150" font-size="19" fill="#080808">JavaScript, Git,</text>
  <text x="905" y="176" font-size="19" fill="#080808">and drop-in code</text>

  <!-- Role to output arrows -->
  <g fill="none" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2">
    <path d="M195,218 L195,296" marker-end="url(#arrow)"/>
    <path d="M550,218 L550,296" marker-end="url(#arrow)"/>
    <path d="M905,218 L905,296" marker-end="url(#arrow)"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="80" y="244" width="230" height="28"/>
    <rect x="435" y="244" width="230" height="28"/>
    <rect x="790" y="244" width="230" height="28"/>
  </g>
  <g font-size="19" fill="#BB0000">
    <text x="195" y="265">adds blocks and content</text>
    <text x="550" y="265">builds blocks and tests</text>
    <text x="905" y="265">adds and customizes</text>
  </g>

  <!-- Output boxes -->
  <rect x="30" y="304" width="330" height="116" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <text x="195" y="354" font-size="23" font-weight="700" fill="#080808">Content &amp; blocks</text>
  <text x="195" y="388" font-size="19" fill="#080808">Words, images, blocks</text>

  <rect x="385" y="304" width="330" height="116" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <text x="550" y="354" font-size="23" font-weight="700" fill="#080808">Blocks &amp; layout options</text>
  <text x="550" y="388" font-size="19" fill="#080808">Fonts, colors, sizes</text>

  <rect x="740" y="304" width="330" height="116" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <text x="905" y="354" font-size="23" font-weight="700" fill="#080808">Drop-ins &amp; behavior</text>
  <text x="905" y="388" font-size="19" fill="#080808">Cart, checkout, product details</text>

  <!-- Output to storefront page arrows -->
  <g fill="none" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2">
    <path d="M195,428 L440,628" marker-end="url(#arrow)"/>
    <path d="M550,428 L550,628" marker-end="url(#arrow)"/>
    <path d="M905,428 L660,628" marker-end="url(#arrow)"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="212" y="506" width="190" height="28"/>
    <rect x="430" y="506" width="240" height="28"/>
    <rect x="698" y="506" width="210" height="28"/>
  </g>
  <g font-size="19" fill="#BB0000">
    <text x="307" y="527">provides content</text>
    <text x="550" y="527">sets structure and style</text>
    <text x="803" y="527">adds shopping features</text>
  </g>

  <!-- Storefront page -->
  <rect x="370" y="636" width="360" height="136" rx="22" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(534 652)" fill="none" stroke="#BB0000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="32" height="32" rx="4"/>
    <path d="M0,11 H32 M12,11 V32"/>
  </g>
  <text x="550" y="716" font-size="26" font-weight="800" fill="#080808">Storefront page</text>
  <text x="550" y="746" font-size="19" fill="#626161">Fast • Consistent • Accessible</text>
</svg>
