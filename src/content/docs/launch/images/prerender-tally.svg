<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" fill="none" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect id="background" width="1100" height="510" fill="#FFFFFF"/>

  <g id="page-1">
    <rect x="40" y="40" width="180" height="190" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <circle cx="70" cy="72" r="16" fill="#BB0000"/>
    <text x="70" y="78" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="58" y="135" font-size="20" font-weight="700" fill="#080808">Category page</text>
    <text x="58" y="166" font-size="16" fill="#080808">Prerendered: 3</text>
    <text x="58" y="192" font-size="16" fill="#626161">Opened next: 1</text>
  </g>

  <g id="page-2">
    <rect x="250" y="40" width="180" height="190" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="280" cy="72" r="16" fill="#737373"/>
    <text x="280" y="78" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="268" y="135" font-size="20" font-weight="700" fill="#080808">Product page</text>
    <text x="268" y="166" font-size="16" fill="#080808">Prerendered: 1</text>
    <text x="268" y="192" font-size="16" fill="#626161">Opened next: 1</text>
  </g>

  <g id="page-3">
    <rect x="460" y="40" width="180" height="190" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <circle cx="490" cy="72" r="16" fill="#BB0000"/>
    <text x="490" y="78" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="478" y="135" font-size="20" font-weight="700" fill="#080808">Category page</text>
    <text x="478" y="166" font-size="16" fill="#080808">Prerendered: 2</text>
    <text x="478" y="192" font-size="16" fill="#626161">Opened next: 1</text>
  </g>

  <g id="page-4">
    <rect x="670" y="40" width="180" height="190" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="700" cy="72" r="16" fill="#737373"/>
    <text x="700" y="78" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="688" y="135" font-size="20" font-weight="700" fill="#080808">Product page</text>
    <text x="688" y="166" font-size="16" fill="#080808">Prerendered: 0</text>
    <text x="688" y="192" font-size="16" fill="#626161">Opened next: 0</text>
  </g>

  <g id="pages-5-10">
    <rect x="880" y="40" width="180" height="190" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="910" cy="72" r="16" fill="#BB0000"/>
    <text x="910" y="77" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">…</text>
    <text x="898" y="135" font-size="20" font-weight="700" fill="#080808">6 more pages</text>
    <text x="898" y="166" font-size="16" fill="#080808">Same steps</text>
    <text x="898" y="192" font-size="16" fill="#626161">Pages 5 to 10</text>
  </g>

  <g id="arrows-between-pages" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226,135 H244 M436,135 H454 M646,135 H664 M856,135 H874" stroke-dasharray="2 3.2"/>
    <path d="M238,129 L245,135 L238,141 M448,129 L455,135 L448,141 M658,129 L665,135 L658,141 M868,129 L875,135 L868,141"/>
  </g>

  <g id="connectors-to-values" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130,236 V258 M340,236 V258 M550,236 V258 M760,236 V258 M970,236 V258" stroke-dasharray="2 3.2"/>
    <path d="M124,256 L130,264 L136,256 M334,256 L340,264 L346,256 M544,256 L550,264 L556,256 M754,256 L760,264 L766,256 M964,256 L970,264 L976,256"/>
  </g>

  <g id="values">
    <rect x="40" y="270" width="180" height="56" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="130" y="308" font-size="28" font-weight="800" fill="#BB0000" text-anchor="middle">+2</text>
    <rect x="250" y="270" width="180" height="56" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="340" y="308" font-size="28" font-weight="800" fill="#737373" text-anchor="middle">+0</text>
    <rect x="460" y="270" width="180" height="56" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="550" y="308" font-size="28" font-weight="800" fill="#BB0000" text-anchor="middle">+1</text>
    <rect x="670" y="270" width="180" height="56" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="760" y="308" font-size="28" font-weight="800" fill="#737373" text-anchor="middle">+0</text>
    <rect x="880" y="270" width="180" height="56" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="970" y="308" font-size="28" font-weight="800" fill="#BB0000" text-anchor="middle">+1</text>
  </g>

  <g id="arrow-add-up">
    <path d="M130,332 V350 M340,332 V350 M550,332 V350 M760,332 V350 M970,332 V350 M130,350 H970 M550,350 V386" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M544,380 L550,388 L556,380" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="562" y="376" font-size="19" fill="#BB0000">add up</text>
  </g>

  <g id="total">
    <rect x="250" y="396" width="600" height="94" rx="22" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="550" y="439" font-size="28" font-weight="800" fill="#080808" text-anchor="middle">4 unopened ÷ 10 page views = 0.4</text>
    <text x="550" y="472" font-size="18" fill="#626161" text-anchor="middle">Enter 0.4 in the calculator</text>
  </g>
</svg>
