<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" fill="none" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="tally-title tally-description">
  <title id="tally-title">Count unopened prerenders across 10 page views</title>
  <desc id="tally-description">For each page, subtract the prerendered pages the shopper opens. The first four pages add 2, 0, 1, and 0 unopened pages. Pages 5 to 10 add 1 more. The total is 4 unopened prerendered pages divided by 10 page views, or 0.4 unopened prerendered pages per page view.</desc>
  <rect id="background" width="1100" height="570" fill="#FFFFFF"/>
  <text x="550" y="46" font-size="30" font-weight="700" fill="#080808" text-anchor="middle">Count unopened prerenders across 10 page views</text>

  <g id="page-1">
    <rect x="32" y="90" width="196" height="236" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="62" cy="120" r="16" fill="#737373"/>
    <text x="62" y="126" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="50" y="170" font-size="20" font-weight="700" fill="#080808">Category page</text>
    <text x="50" y="203" font-size="16" fill="#080808">Prerendered: 3</text>
    <text x="50" y="229" font-size="16" fill="#626161">Of these, opened: 1</text>
    <path d="M50,251 H210" stroke="#BDBDBD"/>
    <text x="130" y="292" font-size="18" font-weight="700" fill="#BB0000" text-anchor="middle">3 - 1 = 2 unopened</text>
  </g>

  <g id="page-2">
    <rect x="242" y="90" width="196" height="236" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="272" cy="120" r="16" fill="#737373"/>
    <text x="272" y="126" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="260" y="170" font-size="20" font-weight="700" fill="#080808">Product page</text>
    <text x="260" y="203" font-size="16" fill="#080808">Prerendered: 1</text>
    <text x="260" y="229" font-size="16" fill="#626161">Of these, opened: 1</text>
    <path d="M260,251 H420" stroke="#BDBDBD"/>
    <text x="340" y="292" font-size="18" font-weight="700" fill="#737373" text-anchor="middle">1 - 1 = 0 unopened</text>
  </g>

  <g id="page-3">
    <rect x="452" y="90" width="196" height="236" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="482" cy="120" r="16" fill="#737373"/>
    <text x="482" y="126" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="470" y="170" font-size="20" font-weight="700" fill="#080808">Category page</text>
    <text x="470" y="203" font-size="16" fill="#080808">Prerendered: 2</text>
    <text x="470" y="229" font-size="16" fill="#626161">Of these, opened: 1</text>
    <path d="M470,251 H630" stroke="#BDBDBD"/>
    <text x="550" y="292" font-size="18" font-weight="700" fill="#BB0000" text-anchor="middle">2 - 1 = 1 unopened</text>
  </g>

  <g id="page-4">
    <rect x="662" y="90" width="196" height="236" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="692" cy="120" r="16" fill="#737373"/>
    <text x="692" y="126" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="680" y="170" font-size="20" font-weight="700" fill="#080808">Product page</text>
    <text x="680" y="203" font-size="16" fill="#080808">Prerendered: 0</text>
    <text x="680" y="229" font-size="16" fill="#626161">Of these, opened: 0</text>
    <path d="M680,251 H840" stroke="#BDBDBD"/>
    <text x="760" y="292" font-size="18" font-weight="700" fill="#737373" text-anchor="middle">0 - 0 = 0 unopened</text>
  </g>

  <g id="pages-5-10">
    <rect x="872" y="90" width="196" height="236" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="890" y="126" font-size="18" font-weight="700" fill="#737373">5 to 10</text>
    <text x="890" y="170" font-size="20" font-weight="700" fill="#080808">6 more pages</text>
    <text x="890" y="203" font-size="16" fill="#080808">Repeat the count</text>
    <text x="890" y="229" font-size="16" fill="#626161">Pages 5 to 10</text>
    <path d="M890,251 H1050" stroke="#BDBDBD"/>
    <text x="970" y="292" font-size="18" font-weight="700" fill="#BB0000" text-anchor="middle">1 unopened in total</text>
  </g>

  <text x="550" y="374" font-size="24" font-weight="700" fill="#080808" text-anchor="middle">2 + 0 + 1 + 0 + 1 = 4 unopened prerendered pages</text>

  <g id="total">
    <rect x="110" y="410" width="880" height="110" rx="8" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="550" y="449" font-size="24" fill="#080808" text-anchor="middle">4 unopened prerendered pages &#247; 10 page views</text>
    <text x="550" y="490" font-size="24" font-weight="800" fill="#BB0000" text-anchor="middle">= 0.4 unopened prerendered pages per page view</text>
  </g>
  <text x="550" y="550" font-size="18" fill="#626161" text-anchor="middle">Enter 0.4 in the calculator</text>
</svg>
