<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" fill="none">
  <rect id="background" width="1100" height="550" fill="#FFFFFF"/>

  <g id="step-1-open-category">
    <rect x="40" y="40" width="232" height="180" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="72" cy="74" r="16" fill="#737373"/>
    <text x="72" y="80" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <g id="icon-grid" transform="translate(220 58)" stroke="#737373" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="11" height="11" rx="2"/>
      <rect x="18" y="3" width="11" height="11" rx="2"/>
      <rect x="3" y="18" width="11" height="11" rx="2"/>
      <rect x="18" y="18" width="11" height="11" rx="2"/>
    </g>
    <text x="64" y="140" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#080808" text-anchor="start">Category page</text>
    <text x="64" y="170" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#080808" text-anchor="start">Shopper opens it</text>
    <text x="64" y="194" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#626161" text-anchor="start">Regular page view</text>
  </g>

  <g id="arrow-1-2">
    <path d="M278,130 H296" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M290,124 L297,130 L290,136" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="step-2-hover-a">
    <rect x="302" y="40" width="232" height="180" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <circle cx="334" cy="74" r="16" fill="#BB0000"/>
    <text x="334" y="80" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <g id="icon-pointer-a" transform="translate(482 58)" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6,3 V26 L12,20 L16,29 L20,27 L16,18 H24 Z"/>
    </g>
    <text x="326" y="140" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#080808" text-anchor="start">Product A</text>
    <text x="326" y="170" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#080808" text-anchor="start">Shopper hovers</text>
    <text x="326" y="194" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#626161" text-anchor="start">Prerendered, never opened</text>
  </g>

  <g id="arrow-2-3">
    <path d="M540,130 H558" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M552,124 L559,130 L552,136" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="step-3-hover-b">
    <rect x="564" y="40" width="232" height="180" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <circle cx="596" cy="74" r="16" fill="#BB0000"/>
    <text x="596" y="80" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <g id="icon-pointer-b" transform="translate(744 58)" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6,3 V26 L12,20 L16,29 L20,27 L16,18 H24 Z"/>
    </g>
    <text x="588" y="140" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#080808" text-anchor="start">Product B</text>
    <text x="588" y="170" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#080808" text-anchor="start">Shopper hovers</text>
    <text x="588" y="194" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#626161" text-anchor="start">Prerendered, then opened</text>
  </g>

  <g id="arrow-3-4">
    <path d="M802,130 H820" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M814,124 L821,130 L814,136" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="step-4-open-b">
    <rect x="826" y="40" width="232" height="180" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="858" cy="74" r="16" fill="#737373"/>
    <text x="858" y="80" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <g id="icon-pointer-click" transform="translate(1006 58)" stroke="#737373" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10,9 V30 L15,25 L19,32 L22,30 L18,23 H25 Z"/>
      <path d="M10,2 V4 M3,9 H5 M4.5,3.5 L6,5 M15.5,3.5 L14,5"/>
    </g>
    <text x="850" y="140" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#080808" text-anchor="start">Product B</text>
    <text x="850" y="170" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#080808" text-anchor="start">Shopper opens it</text>
    <text x="850" y="194" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#626161" text-anchor="start">Uses the prerendered copy</text>
  </g>

  <g id="connectors-to-values">
    <path d="M156,226 V266" stroke="#737373" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M150,264 L156,272 L162,264" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M418,226 V266 M680,226 V266 M942,226 V266" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M412,264 L418,272 L424,264 M674,264 L680,272 L686,264 M936,264 L942,272 L948,264" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="values">
    <rect x="40" y="280" width="232" height="56" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="156" y="316" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#737373" text-anchor="middle">Page view</text>
    <rect x="302" y="280" width="232" height="56" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="418" y="318" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#BB0000" text-anchor="middle">1.2</text>
    <rect x="564" y="280" width="232" height="56" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="680" y="318" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#BB0000" text-anchor="middle">1.2</text>
    <rect x="826" y="280" width="232" height="56" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="942" y="318" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#737373" text-anchor="middle">0</text>
  </g>

  <g id="arrow-extra">
    <path d="M418,342 V398" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M412,392 L418,400 L424,392" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="product-b-note">
    <path d="M680,342 V360 M942,342 V360 M680,360 H942 M811,360 V376" stroke="#737373" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M805,372 L811,380 L817,372" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="811" y="410" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#626161" text-anchor="middle">Product B: 1.2 + 0 = 1.2</text>
    <text x="811" y="436" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#626161" text-anchor="middle">Same as a normal page view</text>
  </g>

  <g id="total">
    <rect x="198" y="408" width="440" height="110" rx="22" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="418" y="458" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#080808" text-anchor="middle">1.2 extra content requests</text>
    <text x="418" y="492" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#626161" text-anchor="middle">Product A, prerendered but never opened</text>
  </g>
</svg>
