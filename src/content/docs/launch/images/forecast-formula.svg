<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040" fill="none" role="img" aria-labelledby="forecast-title forecast-description" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <title id="forecast-title">Example monthly content request forecast</title>
  <desc id="forecast-description">Three columns use the calculator's default values: 200,000 page views, 1.15 average content requests per view, 0.4 unopened prerendered pages per page view, and 10% headroom. Read each equation downward. Their results are 230,000, 92,000, and 32,200, adding up to about 354,200 content requests per month.</desc>
  <rect id="background" width="960" height="1040" fill="#FFFFFF"/>

  <g id="row-page-views">
    <rect x="32" y="32" width="272" height="100" rx="8" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="2"/>
    <text x="168" y="74" font-size="21" font-weight="700" fill="#080808" text-anchor="middle">From page views</text>
    <text x="168" y="108" font-size="18" fill="#626161" text-anchor="middle">Pages shoppers open</text>
    <text x="168" y="174" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="32" y="196" width="272" height="96" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="168" y="230" font-size="18" fill="#626161" text-anchor="middle">Monthly page views</text>
    <text x="168" y="274" font-size="30" font-weight="800" fill="#080808" text-anchor="middle">200,000</text>
    <text x="168" y="338" font-size="28" fill="#626161" text-anchor="middle">&#215;</text>
    <rect x="32" y="360" width="272" height="96" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="168" y="382" font-size="16" fill="#626161" text-anchor="middle">Average content requests</text>
    <text x="168" y="408" font-size="16" fill="#626161" text-anchor="middle">per view</text>
    <text x="168" y="446" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">1.15</text>
    <path d="M168,478 V620" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
    <text x="168" y="662" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="32" y="688" width="272" height="80" rx="8" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="168" y="738" font-size="32" font-weight="800" fill="#BB0000" text-anchor="middle">230,000</text>
  </g>

  <g id="row-prerendered">
    <rect x="344" y="32" width="272" height="100" rx="8" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="2"/>
    <text x="480" y="74" font-size="21" font-weight="700" fill="#080808" text-anchor="middle">From prerendered pages</text>
    <text x="480" y="108" font-size="18" fill="#626161" text-anchor="middle">Unopened prerenders</text>
    <text x="480" y="174" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="344" y="196" width="272" height="96" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="480" y="230" font-size="18" fill="#626161" text-anchor="middle">Monthly page views</text>
    <text x="480" y="274" font-size="30" font-weight="800" fill="#080808" text-anchor="middle">200,000</text>
    <text x="480" y="338" font-size="28" fill="#626161" text-anchor="middle">&#215;</text>
    <rect x="344" y="360" width="272" height="96" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="480" y="382" font-size="16" fill="#626161" text-anchor="middle">Unopened prerendered</text>
    <text x="480" y="408" font-size="16" fill="#626161" text-anchor="middle">pages per page view</text>
    <text x="480" y="446" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">0.4</text>
    <text x="480" y="502" font-size="28" fill="#626161" text-anchor="middle">&#215;</text>
    <rect x="344" y="524" width="272" height="96" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="480" y="546" font-size="16" fill="#626161" text-anchor="middle">Average content requests</text>
    <text x="480" y="572" font-size="16" fill="#626161" text-anchor="middle">per view</text>
    <text x="480" y="610" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">1.15</text>
    <text x="480" y="662" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="344" y="688" width="272" height="80" rx="8" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="480" y="738" font-size="32" font-weight="800" fill="#BB0000" text-anchor="middle">92,000</text>
  </g>

  <g id="row-headroom">
    <rect x="656" y="32" width="272" height="100" rx="8" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="2"/>
    <text x="792" y="74" font-size="21" font-weight="700" fill="#080808" text-anchor="middle">From headroom</text>
    <text x="792" y="108" font-size="18" fill="#626161" text-anchor="middle">Other traffic</text>
    <text x="792" y="174" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="656" y="196" width="272" height="96" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="792" y="218" font-size="16" fill="#626161" text-anchor="middle">230,000 + 92,000</text>
    <text x="792" y="244" font-size="16" fill="#626161" text-anchor="middle">from the other columns</text>
    <text x="792" y="282" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">322,000</text>
    <text x="792" y="338" font-size="28" fill="#626161" text-anchor="middle">&#215;</text>
    <rect x="656" y="360" width="272" height="96" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="792" y="382" font-size="16" fill="#626161" text-anchor="middle">Headroom for</text>
    <text x="792" y="408" font-size="16" fill="#626161" text-anchor="middle">other traffic</text>
    <text x="792" y="446" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">10%</text>
    <path d="M792,478 V620" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
    <text x="792" y="662" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="656" y="688" width="272" height="80" rx="8" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="792" y="738" font-size="32" font-weight="800" fill="#BB0000" text-anchor="middle">32,200</text>
  </g>

  <g id="add-up">
    <path d="M168,770 V802 H792 V770 M480,770 V830" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M474,824 L480,832 L486,824" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="total">
    <rect x="200" y="848" width="560" height="106" rx="8" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="480" y="894" font-size="28" font-weight="800" fill="#080808" text-anchor="middle">About 354,200 content requests</text>
    <text x="480" y="930" font-size="20" fill="#626161" text-anchor="middle">230,000 + 92,000 + 32,200</text>
  </g>

  <g id="legend">
    <rect x="220" y="988" width="28" height="22" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="260" y="1005" font-size="18" fill="#626161">Your input</text>
    <rect x="480" y="988" width="28" height="22" rx="6" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="520" y="1005" font-size="18" fill="#626161">Calculator result</text>
  </g>
</svg>
