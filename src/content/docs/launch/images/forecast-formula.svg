<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" fill="none" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <rect id="background" width="1100" height="550" fill="#FFFFFF"/>

  <g id="row-page-views">
    <rect x="40" y="53" width="240" height="84" rx="14" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="2"/>
    <text x="60" y="91" font-size="19" font-weight="700" fill="#080808">From page views</text>
    <text x="60" y="117" font-size="15" fill="#626161">Pages shoppers open</text>
    <text x="300" y="104" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="320" y="53" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="405" y="83" font-size="13" fill="#626161" text-anchor="middle">Page views</text>
    <text x="405" y="121" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">10,000</text>
    <text x="510" y="104" font-size="26" fill="#626161" text-anchor="middle">×</text>
    <rect x="530" y="53" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="615" y="77" font-size="13" fill="#626161" text-anchor="middle">Content requests</text>
    <text x="615" y="93" font-size="13" fill="#626161" text-anchor="middle">per view</text>
    <text x="615" y="121" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">1.2</text>
    <path d="M708,95 H912" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
    <text x="930" y="104" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="950" y="53" width="110" height="84" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="1005" y="104" font-size="26" font-weight="800" fill="#BB0000" text-anchor="middle">12,000</text>
  </g>

  <g id="row-prerendered">
    <rect x="40" y="173" width="240" height="84" rx="14" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="2"/>
    <text x="60" y="211" font-size="19" font-weight="700" fill="#080808">From prerendered pages</text>
    <text x="60" y="237" font-size="15" fill="#626161">Unopened prerenders</text>
    <text x="300" y="224" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="320" y="173" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="405" y="203" font-size="13" fill="#626161" text-anchor="middle">Page views</text>
    <text x="405" y="241" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">10,000</text>
    <text x="510" y="224" font-size="26" fill="#626161" text-anchor="middle">×</text>
    <rect x="530" y="173" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="615" y="197" font-size="13" fill="#626161" text-anchor="middle">Unopened prerendered</text>
    <text x="615" y="213" font-size="13" fill="#626161" text-anchor="middle">pages per page view</text>
    <text x="615" y="241" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">0.4</text>
    <text x="720" y="224" font-size="26" fill="#626161" text-anchor="middle">×</text>
    <rect x="740" y="173" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="825" y="197" font-size="13" fill="#626161" text-anchor="middle">Content requests</text>
    <text x="825" y="213" font-size="13" fill="#626161" text-anchor="middle">per view</text>
    <text x="825" y="241" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">1.2</text>
    <text x="930" y="224" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="950" y="173" width="110" height="84" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="1005" y="224" font-size="26" font-weight="800" fill="#BB0000" text-anchor="middle">4,800</text>
  </g>

  <g id="row-headroom">
    <rect x="40" y="293" width="240" height="84" rx="14" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="2"/>
    <text x="60" y="331" font-size="19" font-weight="700" fill="#080808">From headroom</text>
    <text x="60" y="357" font-size="15" fill="#626161">Other traffic</text>
    <text x="300" y="344" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="320" y="293" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="405" y="317" font-size="13" fill="#626161" text-anchor="middle">12,000 + 4,800</text>
    <text x="405" y="333" font-size="13" fill="#626161" text-anchor="middle">from the lines above</text>
    <text x="405" y="361" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">16,800</text>
    <text x="510" y="344" font-size="26" fill="#626161" text-anchor="middle">×</text>
    <rect x="530" y="293" width="170" height="84" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="615" y="317" font-size="13" fill="#626161" text-anchor="middle">Headroom for</text>
    <text x="615" y="333" font-size="13" fill="#626161" text-anchor="middle">other traffic</text>
    <text x="615" y="361" font-size="26" font-weight="800" fill="#080808" text-anchor="middle">10%</text>
    <path d="M708,335 H912" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
    <text x="930" y="344" font-size="30" fill="#626161" text-anchor="middle">=</text>
    <rect x="950" y="293" width="110" height="84" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="1005" y="344" font-size="26" font-weight="800" fill="#BB0000" text-anchor="middle">1,680</text>
  </g>

  <g id="add-up">
    <path d="M1062,95 H1080 M1062,215 H1080 M1062,335 H1080 M1080,95 V465 H1068" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M1074,459 L1066,465 L1074,471" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="total">
    <rect x="590" y="415" width="470" height="100" rx="22" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="825" y="460" font-size="28" font-weight="800" fill="#080808" text-anchor="middle">About 18,480 content requests</text>
    <text x="825" y="494" font-size="18" fill="#626161" text-anchor="middle">12,000 + 4,800 + 1,680</text>
  </g>

  <g id="legend">
    <rect x="40" y="436" width="28" height="22" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="80" y="453" font-size="16" fill="#626161">Your input</text>
    <rect x="40" y="474" width="28" height="22" rx="6" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
    <text x="80" y="491" font-size="16" fill="#626161">Calculator result</text>
  </g>
</svg>
