<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" fill="none">
  <rect id="background" width="1100" height="510" fill="#FFFFFF"/>

  <g id="pages">
    <g id="page-category">
      <rect x="40" y="40" width="230" height="120" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
      <g id="icon-grid" transform="translate(60 58)" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="11" height="11" rx="2"/>
        <rect x="18" y="3" width="11" height="11" rx="2"/>
        <rect x="3" y="18" width="11" height="11" rx="2"/>
        <rect x="18" y="18" width="11" height="11" rx="2"/>
      </g>
      <text x="60" y="124" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#080808" text-anchor="start">Category page</text>
      <text x="60" y="148" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#080808" text-anchor="start">Counts as a page view</text>
    </g>

    <g id="page-product">
      <rect x="310" y="40" width="230" height="120" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
      <g id="icon-cube" transform="translate(330 58)" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16,2 L29,9 V23 L16,30 L3,23 V9 Z M3,9 L16,16 L29,9 M16,16 V30"/>
      </g>
      <text x="330" y="124" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#080808" text-anchor="start">Product page</text>
      <text x="330" y="148" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#080808" text-anchor="start">Counts as a page view</text>
    </g>

    <g id="page-cart">
      <rect x="580" y="40" width="230" height="120" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
      <g id="icon-cart" transform="translate(600 58)" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1,2 H6 L10,19 H27 L31,7 H8"/>
        <circle cx="12" cy="25" r="2.6"/>
        <circle cx="25" cy="25" r="2.6"/>
      </g>
      <text x="600" y="124" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#080808" text-anchor="start">Cart page</text>
      <text x="600" y="148" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#080808" text-anchor="start">Counts as a page view</text>
    </g>

    <g id="page-checkout">
      <rect x="850" y="40" width="230" height="120" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
      <g id="icon-card" transform="translate(870 58)" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="28" height="20" rx="3"/>
        <path d="M2,12 H30 M7,20 H12"/>
      </g>
      <text x="870" y="124" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#080808" text-anchor="start">Checkout page</text>
      <text x="870" y="148" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#080808" text-anchor="start">Counts as a page view</text>
    </g>
  </g>

  <g id="arrows-between-pages">
    <path d="M276,100 H302 M546,100 H572 M816,100 H842" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M297,94 L304,100 L297,106 M567,94 L574,100 L567,106 M837,94 L844,100 L837,106" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="arrows-then">
    <path d="M155,166 V196 M425,166 V196 M695,166 V196 M965,166 V196" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M149,192 L155,200 L161,192 M419,192 L425,200 L431,192 M689,192 L695,200 L701,192 M959,192 L965,200 L971,192" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="167" y="188" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#BB0000" text-anchor="start">then</text>
    <text x="437" y="188" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#BB0000" text-anchor="start">then</text>
    <text x="707" y="188" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#BB0000" text-anchor="start">then</text>
    <text x="977" y="188" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#BB0000" text-anchor="start">then</text>
  </g>

  <g id="actions">
    <g id="action-filter">
      <rect x="40" y="208" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="6 5"/>
      <g id="icon-funnel" transform="translate(60 224)" stroke="#737373" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3,4 H29 L19,16 V27 L13,30 V16 Z"/>
      </g>
      <text x="60" y="284" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#080808" text-anchor="start">Filter products</text>
      <text x="250" y="252" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#737373" text-anchor="end">0</text>
    </g>

    <g id="action-add-to-cart">
      <rect x="310" y="208" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="6 5"/>
      <g id="icon-plus" transform="translate(330 224)" stroke="#737373" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="16" r="13"/>
        <path d="M16,10 V22 M10,16 H22"/>
      </g>
      <text x="330" y="284" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#080808" text-anchor="start">Add to cart</text>
      <text x="520" y="252" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#737373" text-anchor="end">0</text>
    </g>

    <g id="action-update-cart">
      <rect x="580" y="208" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="6 5"/>
      <g id="icon-stepper" transform="translate(600 224)" stroke="#737373" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="9" width="28" height="14" rx="7"/>
        <path d="M8,16 H12 M20,16 H24 M22,13 V19"/>
      </g>
      <text x="600" y="284" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#080808" text-anchor="start">Update the cart</text>
      <text x="790" y="252" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#737373" text-anchor="end">0</text>
    </g>

    <g id="action-place-order">
      <rect x="850" y="208" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="6 5"/>
      <g id="icon-check" transform="translate(870 224)" stroke="#737373" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="16" r="13"/>
        <path d="M10,16.5 L14.5,21 L22,12"/>
      </g>
      <text x="870" y="284" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#080808" text-anchor="start">Place an order</text>
      <text x="1060" y="252" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#737373" text-anchor="end">0</text>
    </g>
  </g>

  <g id="arrow-send">
    <path d="M155,306 V330 M425,306 V330 M695,306 V330 M965,306 V330 M155,330 H965 M550,330 V364" stroke="#737373" stroke-width="2" stroke-dasharray="2 3.2" stroke-linecap="round"/>
    <path d="M544,360 L550,368 L556,360" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="562" y="356" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#737373" text-anchor="start">send</text>
  </g>

  <g id="commerce-api-calls">
    <rect x="330" y="376" width="440" height="110" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2" stroke-dasharray="6 5"/>
    <g id="icon-database" transform="translate(354 398)" stroke="#737373" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="7" rx="10" ry="4.5"/>
      <path d="M2,7 V25 A10,4.5 0 0 0 22,25 V7 M2,13 A10,4.5 0 0 0 22,13 M2,19 A10,4.5 0 0 0 22,19"/>
      <path d="M30,14 L25.5,21 H30.5 L26,28"/>
    </g>
    <text x="404" y="412" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#080808" text-anchor="start">Commerce API calls</text>
    <text x="404" y="436" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#626161" text-anchor="start">Sent to Adobe Commerce</text>
    <text x="404" y="468" font-family="'Adobe Clean', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#737373" text-anchor="start">= 0 content requests</text>
  </g>
</svg>
