<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="'Adobe Clean', 'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,1.5 L10,6 L2,10.5" fill="none" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1100" height="800" fill="#FFFFFF"/>

  <!-- Storefront page (browser frame) -->
  <rect x="170" y="20" width="760" height="576" rx="22" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(534 42)" fill="none" stroke="#BB0000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="32" height="32" rx="4"/>
    <path d="M0,11 H32 M12,11 V32"/>
  </g>
  <text x="550" y="112" font-size="32" font-weight="800" fill="#080808">Storefront page</text>
  <text x="550" y="142" font-size="22" fill="#626161">Running in the browser</text>

  <!-- Content blocks -->
  <rect x="210" y="172" width="680" height="112" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <g transform="translate(455 196)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linejoin="round">
    <rect x="0" y="0" width="34" height="12" rx="2.5"/>
    <rect x="0" y="17" width="15" height="13" rx="2.5"/>
    <rect x="19" y="17" width="15" height="13" rx="2.5"/>
  </g>
  <text x="501" y="220" font-size="23" font-weight="700" fill="#080808" text-anchor="start">Content blocks</text>
  <text x="550" y="258" font-size="19" fill="#080808">accordions, cards, columns</text>

  <!-- Commerce blocks -->
  <rect x="210" y="304" width="680" height="252" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <g transform="translate(442 326)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1,2 H6 L10,19 H27 L31,7 H8"/>
    <circle cx="12" cy="25" r="2.6"/>
    <circle cx="25" cy="25" r="2.6"/>
  </g>
  <text x="486" y="349" font-size="23" font-weight="700" fill="#080808" text-anchor="start">Commerce blocks</text>
  <text x="550" y="381" font-size="18" fill="#080808">product-details, commerce-cart, commerce-checkout</text>

  <!-- Drop-ins, nested inside Commerce blocks -->
  <rect x="250" y="402" width="600" height="130" rx="12" fill="#FFF7F7" stroke="#E49999" stroke-width="2"/>
  <g transform="translate(490 428)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3,9 H10 A3.6,3.6 0 1 1 17,9 H24 V15 A3.6,3.6 0 1 1 24,22 V28 H3 Z"/>
  </g>
  <text x="530" y="453" font-size="23" font-weight="700" fill="#080808" text-anchor="start">Drop-ins</text>
  <text x="550" y="490" font-size="19" fill="#080808">product details, cart, checkout</text>

  <!-- Arrows leaving the page -->
  <g fill="none" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2">
    <path d="M500,540 L392,672" marker-end="url(#arrow)"/>
    <path d="M600,540 L708,672" marker-end="url(#arrow)"/>
  </g>
  <text x="404" y="640" font-size="19" fill="#BB0000" text-anchor="end">import</text>
  <text x="696" y="640" font-size="19" fill="#BB0000" text-anchor="start">fetch</text>

  <!-- Storefront SDK -->
  <g transform="translate(364 686)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16,2 L29,9 V23 L16,30 L3,23 V9 Z M3,9 L16,16 L29,9 M16,16 V30"/>
  </g>
  <text x="380" y="756" font-size="23" font-weight="700" fill="#080808">Storefront SDK</text>
  <text x="380" y="784" font-size="19" fill="#080808">tools and UI primitives</text>

  <!-- Commerce data -->
  <g transform="translate(704 686)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="7" rx="10" ry="4.5"/>
    <path d="M2,7 V25 A10,4.5 0 0 0 22,25 V7 M2,13 A10,4.5 0 0 0 22,13 M2,19 A10,4.5 0 0 0 22,19"/>
    <path d="M30,14 L25.5,21 H30.5 L26,28"/>
  </g>
  <text x="720" y="756" font-size="23" font-weight="700" fill="#080808">Commerce data</text>
  <text x="720" y="784" font-size="19" fill="#080808">Commerce APIs</text>
</svg>
