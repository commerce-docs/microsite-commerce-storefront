<svg xmlns="http://www.w3.org/2000/svg" width="793" height="550" viewBox="0 0 793 550" font-family="'Adobe Clean', 'Myriad Pro', Arial, sans-serif" text-anchor="middle" letter-spacing="0" role="img" aria-labelledby="title description">
  <title id="title">How storefront features fit together</title>
  <desc id="description">In the shopper's browser, the Storefront SDK provides UI components and tools to drop-in components and Commerce blocks. Drop-in components provide containers and APIs to Commerce blocks. Commerce blocks supply shopping features and content blocks supply content and layout to storefront pages.</desc>
  <rect width="793" height="550" fill="#fff" />

  <g id="connections" fill="none" stroke="#d00000" stroke-width="1.4" stroke-linecap="round">
    <path id="sdk-to-dropins" d="M 150 110 V 142" stroke-dasharray="1 3" />
    <path id="sdk-to-commerce-blocks" d="M 45 102 C 10 150, 10 305, 65 326" stroke-dasharray="1 3" />
    <path id="dropins-to-commerce-blocks" d="M 150 223 V 301" stroke-dasharray="1 3" />
    <path id="commerce-blocks-to-pages" d="M 245 320 L 315 265" stroke-dasharray="1 3" />
    <path id="content-blocks-to-pages" d="M 570 265 H 490" stroke-dasharray="1 3" />
    <g id="arrowheads" stroke-width="1.6" stroke-linejoin="round">
      <path d="M 147 137 L 150 142 L 153 137" />
      <path d="M 59.3 327 L 65 326 L 61.4 321.4" />
      <path d="M 147 296 L 150 301 L 153 296" />
      <path d="M 309.2 265.7 L 315 265 L 312.9 270.5" />
      <path d="M 495 262 L 490 265 L 495 268" />
    </g>
  </g>

  <g id="headings" fill="#080808" font-size="18" font-weight="700">
    <text id="sdk" x="150" y="64">Storefront SDK</text>
    <text id="dropins" x="150" y="176">Drop-in components</text>
    <text id="commerce-blocks" x="150" y="336">Commerce blocks</text>
    <text id="content-blocks" x="650" y="271">Content blocks</text>
    <text id="pages" x="396.5" y="271" font-size="22">Storefront pages</text>
  </g>

  <g id="descriptions" fill="#080808" font-size="15">
    <text x="396.5" y="28" fill="#757575">Your storefront - shopper's browser</text>
    <text x="150" y="90">Shared UI components and tools</text>
    <text x="150" y="202">Shopping UI and data</text>
    <text x="150" y="362">Standard and custom features</text>
    <text x="650" y="297">Text, images, layout</text>
    <text id="pages-description" x="396.5" y="297" fill="#757575">Content and shopping features</text>
  </g>

  <g id="actions" fill="#d00000" font-size="14">
    <text x="170" y="122" text-anchor="start">UI components</text>
    <text x="170" y="141" text-anchor="start">and tools</text>
    <text x="85" y="264">UI components</text>
    <text x="85" y="283">and tools</text>
    <text x="170" y="267" text-anchor="start">Containers and APIs</text>
    <text x="280" y="342">Shopping</text>
    <text x="280" y="361">features</text>
    <text x="540" y="230">Content and</text>
    <text x="540" y="249">layout</text>
  </g>
</svg>
