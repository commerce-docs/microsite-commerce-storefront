<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="'Adobe Clean', 'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,1.5 L10,6 L2,10.5" fill="none" stroke="#BB0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1100" height="800" fill="#FFFFFF"/>

  <!-- Your storefront project -->
  <rect x="100" y="20" width="900" height="280" rx="22" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="72" font-size="30" font-weight="800" fill="#080808">Your storefront project</text>
  <text x="550" y="102" font-size="21" fill="#626161">Your team's Git repository. You change these.</text>

  <!-- Commerce blocks -->
  <rect x="130" y="130" width="260" height="150" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
  <g transform="translate(244 148)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1,2 H6 L10,19 H27 L31,7 H8"/>
    <circle cx="12" cy="25" r="2.6"/>
    <circle cx="25" cy="25" r="2.6"/>
  </g>
  <text x="260" y="220" font-size="23" font-weight="700" fill="#080808">Commerce blocks</text>
  <text x="260" y="250" font-size="17" fill="#080808" font-family="Menlo, 'SF Mono', Consolas, monospace">blocks/</text>

  <!-- Initializers -->
  <rect x="420" y="130" width="260" height="150" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
  <g transform="translate(534 148)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2,6 H30 M2,16 H30 M2,26 H30"/>
    <circle cx="10" cy="6" r="3.6" fill="#FDECEC"/>
    <circle cx="22" cy="16" r="3.6" fill="#FDECEC"/>
    <circle cx="12" cy="26" r="3.6" fill="#FDECEC"/>
  </g>
  <text x="550" y="220" font-size="23" font-weight="700" fill="#080808">Initializers</text>
  <text x="550" y="250" font-size="17" fill="#080808" font-family="Menlo, 'SF Mono', Consolas, monospace">scripts/initializers/</text>

  <!-- Styles -->
  <rect x="710" y="130" width="260" height="150" rx="14" fill="#FDECEC" stroke="#E49999" stroke-width="2"/>
  <g transform="translate(824 148)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16,2 C16,2 6,13 6,20 A10,10 0 0 0 26,20 C26,13 16,2 16,2 Z"/>
  </g>
  <text x="840" y="220" font-size="23" font-weight="700" fill="#080808">Styles</text>
  <text x="840" y="250" font-size="17" fill="#080808" font-family="Menlo, 'SF Mono', Consolas, monospace">styles/styles.css</text>

  <!-- Arrow: project uses packages -->
  <path d="M550,308 L550,380" fill="none" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" marker-end="url(#arrow)"/>
  <text x="566" y="350" font-size="19" fill="#BB0000" text-anchor="start">use</text>

  <!-- Packages from npm -->
  <rect x="100" y="388" width="900" height="186" rx="22" fill="#EEEEEE" stroke="#BDBDBD" stroke-width="2"/>
  <text x="550" y="432" font-size="30" font-weight="800" fill="#080808">Packages from npm</text>
  <text x="550" y="460" font-size="21" fill="#626161">Installed, not edited.</text>

  <!-- Drop-ins -->
  <rect x="130" y="476" width="410" height="76" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <g transform="translate(154 496)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3,9 H10 A3.6,3.6 0 1 1 17,9 H24 V15 A3.6,3.6 0 1 1 24,22 V28 H3 Z" transform="scale(0.95)"/>
  </g>
  <text x="196" y="508" font-size="23" font-weight="700" fill="#080808" text-anchor="start">Drop-ins</text>
  <text x="196" y="536" font-size="18" fill="#080808" text-anchor="start">product details, cart, checkout</text>

  <!-- Storefront SDK -->
  <rect x="560" y="476" width="410" height="76" rx="14" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <g transform="translate(584 496)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16,2 L29,9 V23 L16,30 L3,23 V9 Z M3,9 L16,16 L29,9 M16,16 V30" transform="scale(0.95)"/>
  </g>
  <text x="626" y="508" font-size="23" font-weight="700" fill="#080808" text-anchor="start">Storefront SDK</text>
  <text x="626" y="536" font-size="18" fill="#080808" text-anchor="start">tools and UI primitives</text>

  <!-- Arrow: drop-ins fetch Commerce data -->
  <path d="M335,584 L488,670" fill="none" stroke="#BB0000" stroke-width="2" stroke-dasharray="2 3.2" marker-end="url(#arrow)"/>
  <text x="420" y="620" font-size="19" fill="#BB0000" text-anchor="start">fetch</text>

  <!-- Commerce data -->
  <g transform="translate(534 682)" fill="none" stroke="#BB0000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="7" rx="10" ry="4.5"/>
    <path d="M2,7 V25 A10,4.5 0 0 0 22,25 V7 M2,13 A10,4.5 0 0 0 22,13 M2,19 A10,4.5 0 0 0 22,19"/>
    <path d="M30,14 L25.5,21 H30.5 L26,28"/>
  </g>
  <text x="550" y="750" font-size="23" font-weight="700" fill="#080808">Commerce data</text>
  <text x="550" y="778" font-size="19" fill="#080808">from your Commerce backend</text>
</svg>
