name: B2B Publication Safety Check

on:
  pull_request:
    branches:
      - develop
    paths:
      - '**/*b2b*/**'
      - '**/dropins-b2b/**'
      - '_dropin-enrichments/**'

jobs:
  validate-b2b-publication:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if PR is from correct branch
        id: check_branch
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"
          
          echo "Source: $SOURCE_BRANCH"
          echo "Target: $TARGET_BRANCH"
          
          # Only check if targeting develop
          if [[ "$TARGET_BRANCH" == "develop" ]]; then
            
            # Check if source is a B2B-related branch
            if [[ "$SOURCE_BRANCH" == *"b2b"* ]] || [[ "$SOURCE_BRANCH" == "releases/b2b-"* ]]; then
              
              # Only allow releases/b2b-nov-release
              if [[ "$SOURCE_BRANCH" == "releases/b2b-nov-release" ]]; then
                echo "✅ VALID: PR from publication branch (releases/b2b-nov-release)"
                echo "valid=true" >> $GITHUB_OUTPUT
              else
                echo "❌ INVALID: B2B branch cannot merge directly to develop"
                echo "Source branch: $SOURCE_BRANCH"
                echo ""
                echo "Only releases/b2b-nov-release can merge to develop."
                echo "Other B2B branches must go through the consolidation workflow."
                echo "valid=false" >> $GITHUB_OUTPUT
                exit 1
              fi
            else
              echo "ℹ️  Non-B2B branch, standard checks apply"
              echo "valid=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "ℹ️  Not targeting develop, skipping B2B checks"
            echo "valid=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Check for proper consolidation
        if: github.head_ref == 'releases/b2b-nov-release'
        run: |
          echo "Verifying publication branch readiness..."
          
          # Check if verification script exists
          if [[ ! -f "./scripts/verify-publication-readiness.sh" ]]; then
            echo "⚠️  Warning: verification script not found"
            echo "This may be expected if the script is in a different branch"
            exit 0
          fi
          
          # Make executable
          chmod +x ./scripts/verify-publication-readiness.sh
          
          # Run verification (but don't fail on warnings)
          ./scripts/verify-publication-readiness.sh || true
          
          echo ""
          echo "✅ Publication branch checks complete"
      
      - name: Comment on PR if blocked
        if: failure() && github.head_ref != 'releases/b2b-nov-release'
        uses: actions/github-script@v7
        with:
          script: |
            const sourceBranch = context.payload.pull_request.head.ref;
            
            const comment = `## ❌ B2B Publication Safety Check Failed
            
            **This PR cannot be merged** because it attempts to merge a B2B branch directly to \`develop\`.
            
            **Source branch:** \`${sourceBranch}\`  
            **Target branch:** \`develop\`
            
            ---
            
            ### ⚠️ Why This is Blocked
            
            All B2B work must flow through the publication consolidation workflow to preserve:
            - All 3,230+ commits from 50+ contributors
            - Complete commit history and attributions
            - Proper validation and verification
            
            ---
            
            ### ✅ Correct Workflow
            
            1. **Consolidate infrastructure:**
               \`\`\`bash
               git checkout releases/b2b-nov-release
               git merge releases/b2b-infrastructure --no-ff
               \`\`\`
            
            2. **Consolidate approved documentation:**
               \`\`\`bash
               git merge releases/b2b-docs-only --no-ff
               \`\`\`
            
            3. **Verify readiness:**
               \`\`\`bash
               ./scripts/verify-publication-readiness.sh
               \`\`\`
            
            4. **Push consolidated branch:**
               \`\`\`bash
               git push origin releases/b2b-nov-release
               \`\`\`
            
            5. **Create new PR:** \`releases/b2b-nov-release\` → \`develop\`
            
            ---
            
            ### 📚 Documentation
            
            - Complete guide: [\`PUBLISH-TO-PRODUCTION-CHECKLIST.md\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/releases/b2b-nov-release/PUBLISH-TO-PRODUCTION-CHECKLIST.md)
            - Quick reference: [\`PUBLISH-B2B-README.md\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/releases/b2b-nov-release/PUBLISH-B2B-README.md)
            - Architecture: [\`DUAL-BRANCH-ARCHITECTURE.md\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/releases/b2b-nov-release/DUAL-BRANCH-ARCHITECTURE.md)
            
            ---
            
            **Close this PR** and follow the correct workflow above.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

