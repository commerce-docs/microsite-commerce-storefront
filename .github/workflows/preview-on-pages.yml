---
name: Deploy site to Pages
on:
  push:
    branches:
      - b2b-documentation
      - preview
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm install
      # STOREFRONT-LLMS-DEPLOY-BASE — env for scripts/generate-llms-full.js public doc URL. Revert: scripts/REVERT-LLMS-DEPLOY-BASE.md
      - name: Build with Astro
        id: build
        env:
          NODE_ENV: github
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          VITE_GITHUB_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: pnpm run generate:llms && pnpm astro build \
            --site "${{ steps.pages.outputs.origin }}"
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
