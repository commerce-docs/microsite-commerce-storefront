---
name: Deploy site to Pages
on:
  push:
    branches:
      - b2b-documentation
      - preview
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build into the /preview2/ subpath'
        required: false
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  deploy:
    uses: ./.github/workflows/preview2-on-pages.yml
    with:
      preview_branch: ${{ github.ref_name }}
      branch: ${{ inputs.branch || '' }}
    secrets: inherit
