---
name: Deploy Preview to Vercel
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (leave empty to use current branch)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          BRANCH_NAME="${{ inputs.branch || github.ref_name }}"
          # Sanitize branch name for URL (replace / with -)
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g')
          CUSTOM_ALIAS="${SAFE_BRANCH}.storefront.dropinkit.com"

          # Deploy and get the deployment URL
          echo "Deploying to Vercel..."
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          
          # Extract the deployment URL (last line that starts with https://)
          DEPLOYMENT_URL=$(echo "$DEPLOY_OUTPUT" | grep -E '^https://' | tail -1)
          
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "❌ Deployment failed - no URL found in output:"
            echo "$DEPLOY_OUTPUT"
            exit 1
          fi
          
          echo "✅ Deployed to: $DEPLOYMENT_URL"

          # Assign custom domain alias
          echo "Setting custom alias: $CUSTOM_ALIAS"
          vercel alias set "$DEPLOYMENT_URL" "$CUSTOM_ALIAS" --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}

          # Use the custom alias as the final URL
          FINAL_URL="https://$CUSTOM_ALIAS"
          echo "url=$FINAL_URL" >> $GITHUB_OUTPUT
          echo "### 🚀 Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`$BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $FINAL_URL" >> $GITHUB_STEP_SUMMARY
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Find PR Number
        id: pr
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ inputs.branch || github.ref_name }}';
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            if (pulls.length > 0) {
              core.setOutput('number', pulls[0].number);
              return pulls[0].number;
            }
            return '';

      - name: Comment on PR
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const deploymentUrl = '${{ steps.deploy.outputs.url }}';
            const branch = '${{ inputs.branch || github.ref_name }}';

            const body = `## 🚀 Preview Deployment Ready\n\n**Branch:** \`${branch}\`\n**Preview URL:** ${deploymentUrl}\n\n<sub>Deployed via [Vercel Preview](${deploymentUrl})</sub>`;

            // Check if we already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview Deployment Ready') &&
              comment.body.includes(`Branch:** \`${branch}\``)
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
